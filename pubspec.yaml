name: flutter_gguf
description: High-performance Flutter plugin for running GGUF (llama.cpp) language models on-device with Dart FFI and streaming token generation.
version: 0.1.0
homepage: https://github.com/GentzofGod/flutter_gguf
repository: https://github.com/GentzofGod/flutter_gguf
issue_tracker: https://github.com/GentzofGod/flutter_gguf/issues
topics:
  - llm
  - gguf
  - llama
  - ai
  - on-device

environment:
  sdk: ^3.0.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_gguf
        pluginClass: FlutterGgufPlugin
